name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: recmanj/github-workflows/.github/workflows/arch-ci.yml@307b8aa52c8cd6cad2e81713ead423e1d02aac45
    permissions:
      contents: read
