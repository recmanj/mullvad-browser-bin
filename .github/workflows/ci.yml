name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: recmanj/github-workflows/.github/workflows/arch-ci.yml@fbb01cb80a90e80a2801aaec1bb11b76cc0bfc98 # v2.1.0
    permissions:
      contents: read
