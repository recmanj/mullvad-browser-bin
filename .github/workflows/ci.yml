name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: recmanj/github-workflows/.github/workflows/arch-ci.yml@65edb3f2d6c83566cfc0cbbe9140122053292643 # v1.0.0
    permissions:
      contents: read
