name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: recmanj/github-workflows/.github/workflows/arch-ci.yml@7f7d29840daa25e53e32fbddc115286215f2117a # v2.0.0
    permissions:
      contents: read
