name: Update

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    uses: recmanj/github-workflows/.github/workflows/arch-update.yml@77d26fb4d7a37c9edec16c668b03b08ed655642b
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      body: 'Release notes: https://github.com/mullvad/mullvad-browser/releases/tag/{version}'
