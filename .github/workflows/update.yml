name: Update

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    uses: recmanj/github-workflows/.github/workflows/arch-update.yml@307b8aa52c8cd6cad2e81713ead423e1d02aac45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      body: 'Release notes: https://github.com/mullvad/mullvad-browser/releases/tag/{version}'
