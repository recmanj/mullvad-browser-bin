name: Update

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    uses: recmanj/github-workflows/.github/workflows/arch-update.yml@65edb3f2d6c83566cfc0cbbe9140122053292643 # v1.0.0
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      body: 'Release notes: https://github.com/mullvad/mullvad-browser/releases/tag/{version}'
