name: Update

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    uses: recmanj/github-workflows/.github/workflows/arch-update.yml@fbb01cb80a90e80a2801aaec1bb11b76cc0bfc98 # v2.1.0
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      body: 'Release notes: https://github.com/mullvad/mullvad-browser/releases/tag/{version}'
