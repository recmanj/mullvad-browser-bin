version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # None for our own workflows: no one else would catch a bad release in the
    # meantime, and the update PR gets reviewed either way
    cooldown:
      default-days: 7
      exclude:
        - recmanj/github-workflows*
    # One PR for all the shared workflows, so they stay on the same version
    groups:
      github-workflows:
        patterns:
          - recmanj/github-workflows*
